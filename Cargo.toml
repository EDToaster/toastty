[workspace]
resolver = "2"
members = [
    "crates/toastty",
    "crates/toastty-pty",
    "crates/toastty-io",
    "crates/toastty-window",
    "crates/toastty-parser",
    "crates/toastty-term",
    "crates/toastty-protocols",
    "crates/toastty-graphics",
    "crates/toastty-render",
    "crates/toastty-config",
    "crates/toastty-markdown",
    "demos/molecule-viewer",
]

# A bare `cargo run` / `cargo build` (no `-p`) targets the terminal itself,
# not the demos. Use `cargo run -p molecule-viewer` for the demo, and
# `cargo test --workspace` to exercise every crate.
default-members = ["crates/toastty"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Pinned exactly — validated by decision prototypes; see docs/decisions/.
winit = "=0.30.13"
# No `gles`/`webgpu`: the renderer only ever requests `Backends::PRIMARY`
# (Vulkan / Metal / DX12), so wgpu's GL backend (glow + EGL loader) was
# compiled and linked in but unreachable, ~0.6 MB of the binary.
wgpu = { version = "=29.0.3", default-features = false, features = ["std", "parking_lot", "dx12", "metal", "vulkan", "wgsl"] }
naga = { version = "29", features = ["wgsl-in", "wgsl-out", "glsl-in"] }
vte = "=0.15.0"
cosmic-text = "=0.19.0"
# Pinned to match cosmic-text 0.19's transitive swash; used directly for
# per-face charmap coverage + color-table detection in emoji presentation
# steering (see toastty-render text::presentation).
swash = "=0.2.7"
# Unicode Emoji / Emoji_Presentation properties for UTS #51 presentation
# selection.
unic-emoji-char = "=0.9.0"
memchr = "=2.8.0"
simdutf8 = "=0.1.5"
unicode-width = "=0.2.2"
# Extended grapheme cluster boundaries (UAX #29) for joining codepoints
# into a cell's grapheme in `Term::print`. Already in the tree via
# cosmic-text; pinned to the same version.
unicode-segmentation = "=1.13.2"

# Range-pinned utilities.
mio = "1"
rustix = { version = "1", features = ["fs", "pty", "process", "termios"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
smallvec = "1"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
bitflags = "2"
raw-window-handle = "0.6"

# Test-only.
insta = "1"
image = "0.25"
image-compare = "0.4"
proptest = "1"

# Internal crates.
toastty-pty = { path = "crates/toastty-pty" }
toastty-io = { path = "crates/toastty-io" }
toastty-window = { path = "crates/toastty-window" }
toastty-parser = { path = "crates/toastty-parser" }
toastty-term = { path = "crates/toastty-term" }
toastty-protocols = { path = "crates/toastty-protocols" }
toastty-graphics = { path = "crates/toastty-graphics" }
toastty-render = { path = "crates/toastty-render" }
toastty-config = { path = "crates/toastty-config" }
toastty-markdown = { path = "crates/toastty-markdown" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"     # noisy on builders
cast_sign_loss = "allow"               # common in FFI byte counts
cast_possible_truncation = "allow"     # common in FFI / fd ints
cast_possible_wrap = "allow"
cast_lossless = "allow"                # `as _` is right for cross-platform FFI
unreadable_literal = "allow"
unnecessary_wraps = "allow"            # `main() -> Result` is normal even when trivial

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Size-optimise cold, code-heavy dependencies: the Markdown block parsers
# and layout engines (Mermaid, LaTeX maths, SVG tree building), the glTF /
# OBJ loaders behind RGP, and petgraph (only the Wayland clipboard's MIME
# sniffing uses it). Each runs once per block / asset / paste, never per
# frame or per PTY byte, and rendering the demo Markdown document
# (diagrams + maths) measured the same at "s" as at 3. Rasterisers
# (tiny-skia, resvg), image codecs, regex engines, font parsing and
# everything on the startup path, the config TOML parser included, stay
# at opt-level 3.
[profile.release.package.mermaid-svg]
opt-level = "s"

[profile.release.package.ratex-parser]
opt-level = "s"

[profile.release.package.ratex-layout]
opt-level = "s"

[profile.release.package.ratex-render]
opt-level = "s"

[profile.release.package.ratex-types]
opt-level = "s"

[profile.release.package.ratex-lexer]
opt-level = "s"

[profile.release.package.ratex-font]
opt-level = "s"

[profile.release.package.usvg]
opt-level = "s"

[profile.release.package.svgtypes]
opt-level = "s"

[profile.release.package.pulldown-cmark]
opt-level = "s"

[profile.release.package.gltf]
opt-level = "s"

[profile.release.package.gltf-json]
opt-level = "s"

[profile.release.package.tobj]
opt-level = "s"

[profile.release.package.petgraph]
opt-level = "s"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
