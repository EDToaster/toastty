[font]
family       = "Fira Mono"
size_px      = 16.0
line_height  = 1.4

[theme]
fg     = "#d9d9d9"
bg     = "#121214"
cursor = "#f2d94c"
palette = [
  "#000000", "#cc3030", "#30cc30", "#cccc30",
  "#3030cc", "#cc30cc", "#30cccc", "#cccccc",
  "#666666", "#ff5050", "#50ff50", "#ffff50",
  "#5050ff", "#ff50ff", "#50ffff", "#ffffff",
]

[cursor]
shape = "block"
blink = true

[shell]
program = "auto"
args    = []

[scrollback]
lines = 10000
smooth_scrolling = true
smoothing_function = "exp_decay"
lines_per_notch = 3
pixel_scroll_sensitivity = 1.0

[security]
osc_52_read  = false
osc_52_write = false

[window]
width             = 1280
height            = 800
vsync             = true
confirm_close     = "always"
extend_background_when = "alt-screen"
grid_align        = "centered"

[window.extend_background]
horizontal = "solid-line"
vertical   = "never"

[window.padding]
top    = 8
right  = 8
bottom = 8
left   = 8

[scroll_button]
enabled  = true
position = "bottom-right"
