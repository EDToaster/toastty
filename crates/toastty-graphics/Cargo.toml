[package]
name = "toastty-graphics"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
icy_sixel = "0.5"
base64 = "0.22"
flate2 = "1"
# Kitty animation frames are kept LZ4-compressed in memory and
# decompressed when a frame is composed (see `frames.rs`). Pure Rust, safe
# mode only.
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# `gltf` for the RGP `.glb` loader. We disable `import` (which pulls
# in image/urlencoding for file-IO and data-URI handling we don't
# need — we feed bytes directly) and keep `utils` for the attribute
# readers.
gltf = { version = "=1.4.1", default-features = false, features = ["utils"] }
# Wavefront `.obj` parser for the RGP `fmt=obj` format. Small dep
# tree (default `ahash` feature on; no other transitives we don't
# already pull). v1 ignores materials (no `.mtl` resolution).
tobj = "=4.0.3"
tracing.workspace = true

toastty-parser.workspace = true

# `t=f` / `t=t` file mediums: `open(O_NONBLOCK | O_NOFOLLOW)` so a client
# can't park the terminal in `open()` on a FIFO (SEC-2).
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# `t=s` off Linux: we can't read the object without `mmap` (unsafe), but
# we still `shm_unlink` it. Linux reads and unlinks it through `/dev/shm`
# with plain `fs` calls.
[target.'cfg(all(unix, not(target_os = "linux"), not(target_os = "android")))'.dependencies]
rustix = { workspace = true, features = ["shm"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
