[package]
name = "toastty"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "toastty"
path = "src/lib.rs"

[[bin]]
name = "toastty"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
icy_sixel = "0.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# `wayland-data-control` makes arboard use the native Wayland clipboard
# (wl_data_control) when WAYLAND_DISPLAY is set, falling back to X11
# otherwise. Without it arboard only speaks X11, which can't read a
# Wayland compositor-owned clipboard through XWayland — so Ctrl+Shift+V
# and OSC 52 reads silently fail on Wayland sessions.
arboard = { version = "3", features = ["wayland-data-control"] }
notify = "8"
pollster.workspace = true
toml.workspace = true
tracing.workspace = true
thiserror.workspace = true
tracing-subscriber.workspace = true
webbrowser = "1"
# In-process sampling profiler for `bench/` (SIGPROF; needs no perf
# permissions). Off by default: `--features pprof`, then `TOASTTY_PPROF=<path>`.
pprof = { version = "0.15", optional = true, default-features = false, features = ["large-depth"] }

toastty-config.workspace = true
toastty-io.workspace = true
toastty-markdown.workspace = true
toastty-parser.workspace = true
toastty-protocols.workspace = true
toastty-pty.workspace = true
toastty-render.workspace = true
toastty-term.workspace = true
toastty-window.workspace = true

[features]
pprof = ["dep:pprof"]

[dev-dependencies]
toastty-graphics.workspace = true

[lints]
workspace = true
